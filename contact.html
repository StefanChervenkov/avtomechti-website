<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Avtomechti</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100">
  <nav class="bg-gray-800 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="text-2xl font-bold text-blue-400">AVTOMECHTI</div>
      <ul class="flex gap-6">
        <li><a href="index.html" class="hover:text-blue-400 transition">Home</a></li>
        <li><a href="cars.html" class="hover:text-blue-400 transition">Our Listings</a></li>
        <li><a href="partners.html" class="hover:text-blue-400 transition">Partners</a></li>
        <li><a href="about.html" class="hover:text-blue-400 transition">About Us</a></li>
        <li><a href="contact.html" class="hover:text-blue-400 transition">Contact</a></li>
      </ul>
    </div>
  </nav>

  <section class="max-w-7xl mx-auto px-4 py-16">
    <h1 class="text-4xl font-bold mb-12">Contact Us</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- Contact Info -->
      <div>
        <div class="bg-gray-800 rounded-lg p-8 mb-8">
          <h2 class="text-2xl font-bold text-blue-400 mb-6">Get in Touch</h2>
          
          <div class="mb-6">
            <h3 class="text-lg font-bold text-white mb-2">Phone</h3>
            <p class="text-gray-300">+359 (0) 123 456 789</p>
          </div>
          
          <div class="mb-6">
            <h3 class="text-lg font-bold text-white mb-2">Email</h3>
            <p class="text-gray-300">info@avtomechti.bg</p>
          </div>
          
          <div class="mb-6">
            <h3 class="text-lg font-bold text-white mb-2">Address</h3>
            <p class="text-gray-300">Your City, Bulgaria</p>
          </div>
          
          <div>
            <h3 class="text-lg font-bold text-white mb-2">Mobile.bg Profile</h3>
            <a href="https://avtomechti.mobile.bg/" target="_blank" rel="noopener noreferrer"
               class="text-blue-400 hover:text-blue-300 transition">
              Visit our Mobile.bg Page
            </a>
          </div>
        </div>
      </div>
      
      <!-- Contact Form -->
      <div class="bg-gray-800 rounded-lg p-8">
        <h2 class="text-2xl font-bold text-blue-400 mb-6">Send us a Message</h2>
        <form class="space-y-4">
          <div>
            <label class="block text-white font-bold mb-2">Name</label>
            <input type="text" placeholder="Your name" class="w-full px-4 py-2 bg-gray-700 text-white rounded border border-gray-600 focus:border-blue-400 outline-none">
          </div>
          
          <div>
            <label class="block text-white font-bold mb-2">Email</label>
            <input type="email" placeholder="Your email" class="w-full px-4 py-2 bg-gray-700 text-white rounded border border-gray-600 focus:border-blue-400 outline-none">
          </div>
          
          <div>
            <label class="block text-white font-bold mb-2">Phone</label>
            <input type="tel" placeholder="Your phone" class="w-full px-4 py-2 bg-gray-700 text-white rounded border border-gray-600 focus:border-blue-400 outline-none">
          </div>
          
          <div>
            <label class="block text-white font-bold mb-2">Message</label>
            <textarea placeholder="Your message" rows="5" class="w-full px-4 py-2 bg-gray-700 text-white rounded border border-gray-600 focus:border-blue-400 outline-none"></textarea>
          </div>
          
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded transition-colors">
            Send Message
          </button>
        </form>
      </div>
    </div>
  </section>

  <footer class="bg-gray-800 text-center py-8 border-t border-gray-700 mt-16">
    <p class="text-gray-400">© 2024 Avtomechti. All rights reserved.</p>
  </footer>
</body>
</html>
